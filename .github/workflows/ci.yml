name: CI

on:
  push:
    branches:
      - master
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - configuration: Debug
            target: test
          - configuration: Release
            target: coverage

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install dependencies
        run: make install

      - name: Lint, build, and test
        run: make lint ${{ matrix.target }} CONFIGURATION=${{ matrix.configuration }} TEST_ARGS="--results-directory TestResults --hangdump --hangdump-timeout 3m"

      - name: Upload hang dumps
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hangdumps-${{ matrix.configuration }}
          path: "**/TestResults/*.dmp"
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: matrix.configuration == 'Release'
        uses: codecov/codecov-action@v7
        with:
          files: ./artifacts/coverage.cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
