name: CI

on:
  push:
    branches:
      - master
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "release/**"
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Verify (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - configuration: Debug
            target: tests
          - configuration: Release
            target: coverage

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install dependencies
        run: make install

      - name: Lint, build, and test
        run: make lint ${{ matrix.target }} CONFIGURATION=${{ matrix.configuration }}

      - name: Upload coverage to Codecov
        if: matrix.configuration == 'Release'
        uses: codecov/codecov-action@v7
        with:
          files: ./artifacts/unit.cobertura.xml,./artifacts/integration.cobertura.xml
          fail_ci_if_error: true
          token: ${{ secrets.CODECOV_TOKEN }}
